name: Legacy Python archive checks

on:
  push:
    branches: [main]
    paths:
      - 'legacy/**'
      - '.github/workflows/python-checks.yml'
  pull_request:
    paths:
      - 'legacy/**'
      - '.github/workflows/python-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: 'legacy'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install legacy Python helper dependencies
        run: python -m pip install -r legacy/requirements.txt
      - name: Compile legacy Python modules
        run: python -m compileall -q legacy
      - name: Run legacy isolated regression tests
        run: python -m unittest discover -s legacy/tests -p "test_*.py" -v
