name: Python TUI checks

on:
  push:
    branches: [main, feat/tui-openclaw]
    paths:
      - '*.py'
      - '*tui*'
      - 'requirements.txt'
      - 'tests/test_*.py'
      - '.github/workflows/python-checks.yml'
  pull_request:
    paths:
      - '*.py'
      - '*tui*'
      - 'requirements.txt'
      - 'tests/test_*.py'
      - '.github/workflows/python-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install TUI dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q tui.py stack_manager.py tests
      - name: Run isolated regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check Windows PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'launch-tui.ps1'), [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Check CLI
        run: python tui.py --help
