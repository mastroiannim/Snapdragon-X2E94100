name: Python runtime checks

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'tests/test_*.py'
      - '.github/workflows/python-checks.yml'
  pull_request:
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'tests/test_*.py'
      - '.github/workflows/python-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime helper dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q stack_manager.py kilo_config.py tests
      - name: Run isolated regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
